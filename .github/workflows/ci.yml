name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-e-testes:
    name: Build, testes e cobertura (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # mvn verify: compila, roda JUnit e falha se a cobertura ficar abaixo do minimo (JaCoCo check)
      - name: mvn verify
        run: mvn -B verify

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            target/surefire-reports/
            target/site/jacoco/

  docker:
    name: Suite dentro do Docker Compose
    runs-on: ubuntu-latest
    needs: build-e-testes
    steps:
      - uses: actions/checkout@v4

      # O mesmo comando que o professor vai rodar
      - name: docker compose run --rm testes
        run: docker compose run --rm testes

      - name: Imagem da aplicacao constroi
        run: docker compose build app
