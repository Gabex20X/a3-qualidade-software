services:
  app:
    build:
      context: .
      target: app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_URL: "jdbc:sqlite:/app/dados/financas.db"
    volumes:
      - dados:/app/dados

  testes:
    build:
      context: .
      target: testes
    profiles: ["testes"]
    volumes:
      - m2:/root/.m2

volumes:
  dados:
  m2:
